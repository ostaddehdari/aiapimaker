name: Repository verification

on:
  push:
    branches: [main, "stage/**"]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate repository structure and credential file names
        run: python3 scripts/verify_repository.py
      - name: Validate shell script syntax
        shell: bash
        run: |
          for file in scripts/*.sh; do bash -n "$file"; done
      - name: Compile Python scripts
        run: python3 -m compileall -q scripts
      - name: Install Ruff
        run: python3 -m pip install --disable-pip-version-check ruff==0.14.0
      - name: Ruff lint
        run: ruff check scripts
      - name: Ruff format
        run: ruff format --check scripts

  django:
    name: django-backend
    runs-on: ubuntu-latest
    env:
      DJANGO_SETTINGS_MODULE: config.settings.testing
      PYTHONPATH: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend dev requirements
        run: python -m pip install --disable-pip-version-check -r backend/requirements-dev.txt
      - name: Django system checks
        run: python backend/manage.py check --settings=config.settings.testing
      - name: Run isolated Django tests
        run: python backend/manage.py test apps.core --noinput --settings=config.settings.testing
      - name: Run pytest-django health tests
        run: pytest -q backend/apps/core/tests.py --ds=config.settings.testing
      - name: Validate OpenAPI schema
        run: python backend/manage.py spectacular --file /tmp/aiapimaker-openapi.yaml --validate --settings=config.settings.testing
      - name: Ruff syntax and style
        run: ruff check backend

  frontend:
    name: frontend-react
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install --no-audit --no-fund
      - name: TypeScript check
        working-directory: frontend
        run: npm run lint
      - name: React component tests
        working-directory: frontend
        run: npm run test
      - name: Build under /aiapimaker/
        working-directory: frontend
        env:
          VITE_BASE_PATH: /aiapimaker/
        run: npm run build
      - name: Build at domain root
        working-directory: frontend
        env:
          VITE_BASE_PATH: /
        run: npm run build
      - name: Check that no remote font/CDN is required
        working-directory: frontend
        shell: bash
        run: |
          if grep -R -n -E '(https?://fonts\.googleapis\.com|https?://cdn\.)' src index.html; then
            echo "External font/CDN reference is not allowed"
            exit 1
          fi

  secrets:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan committed secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
