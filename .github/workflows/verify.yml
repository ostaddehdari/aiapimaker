name: Repository verification

on:
  push:
    branches: [main, "stage/**"]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate repository structure and credential file names
        run: python3 scripts/verify_repository.py
      - name: Validate shell script syntax
        shell: bash
        run: |
          for file in scripts/*.sh; do bash -n "$file"; done
      - name: Compile Python scripts
        run: python3 -m compileall -q scripts
      - name: Install Ruff
        run: python3 -m pip install --disable-pip-version-check ruff==0.14.0
      - name: Ruff lint
        run: ruff check scripts
      - name: Ruff format
        run: ruff format --check scripts

  django:
    name: django-backend
    runs-on: ubuntu-latest
    env:
      DJANGO_SETTINGS_MODULE: config.settings.testing
      PYTHONPATH: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend dev requirements
        run: python -m pip install --disable-pip-version-check -r backend/requirements-dev.txt
      - name: Ensure all schema migrations are committed
        run: python backend/manage.py makemigrations --check --dry-run --settings=config.settings.testing
      - name: Django system checks
        run: python backend/manage.py check --settings=config.settings.testing
      - name: Run isolated Django tests
        run: python backend/manage.py test apps.core apps.users --noinput --settings=config.settings.testing
      - name: Run pytest-django health tests
        run: pytest -q backend/apps/core/tests.py backend/apps/users/tests.py --ds=config.settings.testing
      - name: Validate OpenAPI schema
        run: python backend/manage.py spectacular --file /tmp/aiapimaker-openapi.yaml --validate --settings=config.settings.testing
      - name: Ruff syntax and style
        run: ruff check backend


  postgres-schema:
    name: postgres-schema
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: aiapimaker_ci
          POSTGRES_PASSWORD: local_ci_only
          POSTGRES_DB: aiapimaker_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aiapimaker_ci -d aiapimaker_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DJANGO_SETTINGS_MODULE: config.settings.staging
      DJANGO_SECRET_KEY: ci-generated-placeholder-only-do-not-deploy
      DATABASE_URL: postgres://aiapimaker_ci:local_ci_only@127.0.0.1:5432/aiapimaker_ci
      DJANGO_ALLOWED_HOSTS: 127.0.0.1,localhost
      PYTHONPATH: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install isolated Django requirements
        run: python -m pip install --disable-pip-version-check -r backend/requirements-dev.txt
      - name: Apply initial schema and safe provider seeds on temporary PostgreSQL
        run: python backend/manage.py migrate --noinput --settings=config.settings.staging
      - name: Ensure no missing or inconsistent migrations
        run: python backend/manage.py makemigrations --check --dry-run --settings=config.settings.staging
      - name: Exercise seed migration rollback and replay
        run: |
          python backend/manage.py migrate providers 0001 --noinput --settings=config.settings.staging
          python backend/manage.py migrate providers 0002 --noinput --settings=config.settings.staging
      - name: Roll back and replay artifact schema on temporary PostgreSQL
        run: |
          python backend/manage.py migrate artifacts zero --noinput --settings=config.settings.staging
          python backend/manage.py migrate artifacts --noinput --settings=config.settings.staging
      - name: Run schema isolation tests against temporary PostgreSQL
        run: python backend/manage.py test apps.core apps.users --noinput --settings=config.settings.staging

  frontend:
    name: frontend-react
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Use npm 11 on CI (separate from the Ubuntu production host)
        run: npm install --global npm@11
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install --no-audit --no-fund
      - name: TypeScript check
        working-directory: frontend
        run: npm run lint
      - name: React component tests
        working-directory: frontend
        run: npm run test
      - name: Build under /aiapimaker/
        working-directory: frontend
        env:
          VITE_BASE_PATH: /aiapimaker/
        run: npm run build
      - name: Build at domain root
        working-directory: frontend
        env:
          VITE_BASE_PATH: /
        run: npm run build
      - name: Check that no remote font/CDN is required
        working-directory: frontend
        shell: bash
        run: |
          if grep -R -n -E '(https?://fonts\.googleapis\.com|https?://cdn\.)' src index.html; then
            echo "External font/CDN reference is not allowed"
            exit 1
          fi

  secrets:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan committed secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
