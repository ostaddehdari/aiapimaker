name: Repository verification

on:
  push:
    branches: [main, "stage/**"]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate repository structure and credential file names
        run: python3 scripts/verify_repository.py
      - name: Validate shell script syntax
        shell: bash
        run: |
          for file in scripts/*.sh; do bash -n "$file"; done
      - name: Compile Python scripts
        run: python3 -m compileall -q scripts
      - name: Install Ruff
        run: python3 -m pip install --disable-pip-version-check ruff==0.14.0
      - name: Ruff lint
        run: ruff check scripts
      - name: Ruff format
        run: ruff format --check scripts

  secrets:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan committed secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
