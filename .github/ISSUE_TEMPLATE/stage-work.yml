name: Stage work
description: Track an implementation, test, or documentation task in a numbered stage
title: "[Stage NN] "
labels: []
body:
  - type: input
    id: stage
    attributes:
      label: Stage / Work ID
      placeholder: W02.01
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Objective and testable completion
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence and blockers
      description: Include logs/screenshots without secrets
    validations:
      required: false
